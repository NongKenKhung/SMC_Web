# สำหรับ VM ที่มี nginx ของ host รันอยู่แล้ว (เช่นมีเว็บอื่นอยู่ก่อน)
# วางไว้ที่ /etc/nginx/sites-available/k-sml.com แล้ว symlink ไป sites-enabled/
#
# กรณีนี้ "ห้าม" ใช้ docker-compose.tls.yml เพราะ nginx ใน container จะไปแย่งพอร์ต
# 80/443 กับ nginx ของ host ทำให้เว็บอื่นบนเครื่องเดียวกันล่ม
# ให้สตาร์ตเฉพาะ docker-compose.prod.yml แล้วตั้ง WEB_PORT ให้ผูกกับ 127.0.0.1

# ---- IP จริงของผู้เข้าชมจาก Cloudflare ----
# ถ้า nginx ของเครื่องตั้งค่านี้ไว้ที่ระดับ http อยู่แล้ว (เช่นในไฟล์ของเว็บอื่น
# หรือใน conf.d/cloudflare.conf) ให้ลบบล็อกนี้ออก ประกาศซ้ำได้แต่ไม่จำเป็น
# รายการ ip อัปเดตได้ที่ https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ค่าเดียวที่ต้องแก้ให้ตรงกับ WEB_PORT ใน .env
upstream smc_web {
    server 127.0.0.1:8090;
}

server {
    listen 80;
    listen [::]:80;
    server_name k-sml.com www.k-sml.com;
    return 301 https://k-sml.com$request_uri;
}

# www → ไม่มี www (ให้เหลือที่อยู่เดียว ไม่ให้ SEO แตกเป็นสองที่)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.k-sml.com;

    ssl_certificate     /etc/ssl/cloudflare/k-sml.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/k-sml.com.key;

    return 301 https://k-sml.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name k-sml.com;

    ssl_certificate     /etc/ssl/cloudflare/k-sml.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/k-sml.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/k-sml.com.access.log;
    error_log  /var/log/nginx/k-sml.com.error.log;

    # ต้องมากกว่าเพดานของ API (โบรชัว 15 MB / ไฟล์แนบ 20 MB)
    # ค่าเริ่มต้นของ nginx คือ 1 MB — ถ้าไม่ตั้ง การอัปโหลดโบรชัวจะโดน 413
    # ตั้งแต่ที่ nginx โดย API ไม่เห็นคำขอเลย
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # ไฟล์อัปโหลดกับ asset ของ Next มีชื่อไม่ซ้ำอยู่แล้ว (timestamp/hash) แคชยาวได้
    location ~ ^/(uploads|_next/static)/ {
        proxy_pass http://smc_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://smc_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # ต่อ ip จริงไว้หัวแถว เพื่อให้ API รู้ว่าใครเป็นผู้เข้าชมตัวจริง
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # อัปโหลดไฟล์ใหญ่ใช้เวลานาน อย่าตัดกลางคัน
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;
    }
}
