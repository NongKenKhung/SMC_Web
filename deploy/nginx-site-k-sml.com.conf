# สำหรับ VM ที่มี nginx ของ host รันอยู่แล้ว (เช่นมีเว็บอื่นอยู่ก่อน)
# วางไว้ที่ /etc/nginx/sites-available/k-sml.com แล้ว symlink ไป sites-enabled/
#
# กรณีนี้ "ห้าม" ใช้ docker-compose.tls.yml เพราะ nginx ใน container จะไปแย่งพอร์ต
# 80/443 กับ nginx ของ host ทำให้เว็บอื่นบนเครื่องเดียวกันล่ม
# ให้สตาร์ตเฉพาะ docker-compose.prod.yml แล้วตั้ง WEB_PORT ให้ผูกกับ 127.0.0.1

# หมายเหตุ: การอ่าน ip จริงจาก Cloudflare (set_real_ip_from / real_ip_header)
# ไม่ได้อยู่ในไฟล์นี้ เพราะต้องประกาศครั้งเดียวต่อเครื่อง ไม่ใช่ต่อเว็บ
# ประกาศซ้ำจะทำให้ nginx -t ไม่ผ่านทั้งเครื่อง
# ถ้าเครื่องยังไม่มี ให้ติดตั้ง deploy/nginx-cloudflare-realip.conf ไปที่ /etc/nginx/conf.d/
# เช็คก่อนด้วย: sudo grep -rl real_ip_header /etc/nginx/


# ค่าเดียวที่ต้องแก้ให้ตรงกับ WEB_PORT ใน .env
upstream smc_web {
    server 127.0.0.1:8090;
}

server {
    listen 80;
    listen [::]:80;
    server_name k-sml.com www.k-sml.com;
    return 301 https://k-sml.com$request_uri;
}

# www → ไม่มี www (ให้เหลือที่อยู่เดียว ไม่ให้ SEO แตกเป็นสองที่)
server {
    # ไม่ระบุ http2 ตรงนี้ — ถ้ามี server block อื่นฟัง 443 อยู่ก่อนแล้ว nginx จะใช้ค่า
    # จากบล็อกแรกที่เจอ การระบุซ้ำได้แค่ warning "protocol options redefined"
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.k-sml.com;

    ssl_certificate     /etc/ssl/cloudflare/k-sml.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/k-sml.com.key;

    return 301 https://k-sml.com$request_uri;
}

server {
    # ไม่ระบุ http2 ตรงนี้ — ถ้ามี server block อื่นฟัง 443 อยู่ก่อนแล้ว nginx จะใช้ค่า
    # จากบล็อกแรกที่เจอ การระบุซ้ำได้แค่ warning "protocol options redefined"
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name k-sml.com;

    ssl_certificate     /etc/ssl/cloudflare/k-sml.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/k-sml.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/k-sml.com.access.log;
    error_log  /var/log/nginx/k-sml.com.error.log;

    # ต้องมากกว่าเพดานของ API (โบรชัว 15 MB / ไฟล์แนบ 20 MB)
    # ค่าเริ่มต้นของ nginx คือ 1 MB — ถ้าไม่ตั้ง การอัปโหลดโบรชัวจะโดน 413
    # ตั้งแต่ที่ nginx โดย API ไม่เห็นคำขอเลย
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # ไฟล์อัปโหลดกับ asset ของ Next มีชื่อไม่ซ้ำอยู่แล้ว (timestamp/hash) แคชยาวได้
    location ~ ^/(uploads|_next/static)/ {
        proxy_pass http://smc_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://smc_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # ต่อ ip จริงไว้หัวแถว เพื่อให้ API รู้ว่าใครเป็นผู้เข้าชมตัวจริง
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # อัปโหลดไฟล์ใหญ่ใช้เวลานาน อย่าตัดกลางคัน
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;
    }
}
