# nginx รับ HTTPS แล้วส่งต่อให้ Next ที่อยู่ในเครือข่ายภายในของ compose
# วางไว้ที่ /etc/nginx/conf.d/default.conf ของ image nginx ทางการ
#
# ใบรับรองใช้ Cloudflare Origin Certificate (อายุ 15 ปี ไม่ต้องต่ออายุ)
# เบราว์เซอร์ไม่เชื่อถือใบชนิดนี้โดยตรง มีแต่ Cloudflare ที่เชื่อ
# จึงต้องเปิด proxy ของ Cloudflare ไว้เสมอ (เมฆสีส้ม) และตั้ง SSL/TLS เป็น Full (strict)

# ---- ดึง IP จริงของผู้เข้าชมจาก Cloudflare ----
# ถ้าไม่ตั้ง nginx จะเห็นแต่ IP ของ Cloudflare เหมือนกันหมดทุกคน
# ทำให้ตัวจำกัดจำนวนครั้งของฟอร์มติดต่อกลายเป็นโควตารวมของทั้งเว็บ
# รายการ IP อัปเดตได้ที่ https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# http → https
server {
    listen 80;
    listen [::]:80;
    server_name k-sml.com www.k-sml.com;
    return 301 https://k-sml.com$request_uri;
}

# www → ไม่มี www (ให้เหลือชื่อเดียว ไม่ให้ SEO แตกเป็นสองที่อยู่)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.k-sml.com;

    ssl_certificate     /certs/origin.pem;
    ssl_certificate_key /certs/origin-key.pem;

    return 301 https://k-sml.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name k-sml.com;

    ssl_certificate     /certs/origin.pem;
    ssl_certificate_key /certs/origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ต้องมากกว่าเพดานของ API (โบรชัว 15 MB / ไฟล์แนบ 20 MB)
    # ค่าเริ่มต้นของ nginx คือ 1 MB — ถ้าไม่ตั้ง การอัปโหลดโบรชัวจะโดนตัดตั้งแต่ที่ nginx
    # ด้วย 413 โดยที่ API ไม่ได้เห็นคำขอเลย
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # ไฟล์อัปโหลดกับ asset ของ Next มีชื่อไม่ซ้ำอยู่แล้ว (มี timestamp/hash) แคชยาวได้
    location ~ ^/(uploads|_next/static)/ {
        proxy_pass http://web:3100;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        # web คือชื่อ service ใน compose — คุยกันในเครือข่ายภายใน ไม่ออกอินเทอร์เน็ต
        proxy_pass http://web:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # ต่อ IP จริงไว้หัวแถว เพื่อให้ API อ่านได้ว่าใครเป็นผู้เข้าชมตัวจริง
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # อัปโหลดไฟล์ใหญ่ใช้เวลานาน อย่าตัดกลางคัน
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;
    }
}
